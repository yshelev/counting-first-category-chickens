services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./client:/app/static
    environment:
      - WORKER_URL=http://worker:8001
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - worker

  worker:
    build: ./worker
    ports:
      - "8001:8001"
    volumes:
      - ./worker:/app  
      - ./test:/test   
    env_file:
      - .env
    environment:
      - SERVER_URL=http://server:8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
